services:
  database:
    image: postgres:17-alpine
    container_name: imobpredict-postgres

    restart: unless-stopped

    environment:
      POSTGRES_DB: imobpredict
      POSTGRES_USER: imobpredict
      POSTGRES_PASSWORD: ${DB_PASSWORD}

    ports:
      - "127.0.0.1:5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Cria as tabelas na primeira vez que o banco é iniciado.
      - ./backend/src/database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U imobpredict -d imobpredict"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: